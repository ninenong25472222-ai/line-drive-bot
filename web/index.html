<!doctype html>
<html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rental Desk</title><link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet"><style>
:root{--ink:#25283b;--muted:#7e8498;--bg:#f7f8fc;--card:#fff;--line:#e8ebf2;--brand:#7458d8;--soft:#f0edff;--orange:#fff0e2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Prompt,system-ui,sans-serif}.wrap{max-width:1050px;margin:auto;padding:18px 15px 48px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.eyebrow{font-size:12px;color:var(--brand);font-weight:600}.title{font-size:29px;margin:2px 0}.sub{font-size:13px;color:var(--muted);margin:0}.btn,.tab,.input,.select{font:inherit;border-radius:12px}.btn{border:0;background:#fff;color:var(--brand);padding:10px 13px;box-shadow:0 5px 16px #4a3b8b18;cursor:pointer}.hero{background:linear-gradient(135deg,#7560dc,#9b82ed);color:#fff;border-radius:24px;padding:20px;box-shadow:0 12px 28px #6b54cc35;margin-bottom:15px}.hero small{opacity:.8}.hero h2{margin:4px 0 12px;font-size:23px}.numbers{display:flex;gap:18px}.numbers b{font-size:24px;display:block}.numbers span{font-size:11px;opacity:.8}.panel{background:#ffffffd9;border:1px solid #fff;border-radius:20px;padding:12px;box-shadow:0 8px 25px #27315b0d;margin-bottom:15px}.tools{display:grid;grid-template-columns:1.7fr 1fr 1fr auto;gap:9px}.input,.select{border:1px solid var(--line);background:#fff;padding:11px 12px;color:var(--ink);min-width:0;outline:0}.input:focus,.select:focus{border-color:var(--brand)}.tabs{display:flex;gap:8px;margin-top:11px}.tab{border:1px solid var(--line);background:#fff;color:var(--muted);padding:8px 13px;cursor:pointer}.tab.active{background:var(--soft);border-color:#d7ceff;color:#5e47bf;font-weight:600}.day{margin:14px 0 20px}.dayhead{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding:4px 2px 8px}.daytitle{font-size:17px;font-weight:600}.daytitle em{font-style:normal;color:var(--brand);font-size:12px;margin-left:6px}.daycount{font-size:12px;color:var(--muted)}.cards{display:grid;gap:9px;margin-top:9px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 5px 15px #2933540b}.summary{display:grid;grid-template-columns:8px 1fr auto;gap:10px;align-items:center;padding:13px;cursor:pointer}.stripe{height:36px;border-radius:8px;background:var(--brand)}.stripe.other{background:#ef9b56}.name{font-weight:600;font-size:14px}.line{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.pill{font-size:10px;background:var(--soft);color:#604bc2;border-radius:99px;padding:3px 7px}.pill.other{background:var(--orange);color:#ba6d2c}.meta{display:flex;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:11px;margin-top:3px}.time{color:var(--ink);font-weight:600;white-space:nowrap}.arrow{color:var(--muted);font-size:20px}.card.open .arrow{transform:rotate(180deg)}.details{display:none;background:#fbfcff;border-top:1px solid var(--line);padding:12px 14px;grid-template-columns:1fr 1fr;gap:10px}.card.open .details{display:grid}.detail label{display:block;color:var(--muted);font-size:10px}.detail strong{font-size:12px;word-break:break-word}.full{grid-column:1/-1}.file{display:inline-block;margin-top:6px;color:#fff;background:var(--brand);padding:8px 11px;border-radius:10px;text-decoration:none;font-size:12px}.empty,.loading{text-align:center;color:var(--muted);padding:38px 10px}.calendar{display:none}.calendar.show{display:block}.list.hide{display:none}.monthbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.monthbar h3{margin:0;font-size:17px}.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.dow{text-align:center;color:var(--muted);font-size:11px;padding:4px}.cell{min-height:95px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:7px}.cell.muted{opacity:.38}.num{font-size:12px;font-weight:600}.event{display:block;margin-top:5px;padding:4px 5px;background:var(--soft);color:#5b46ba;border-radius:6px;font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.event.other{background:var(--orange);color:#b46c2d}@media(max-width:650px){.wrap{padding:14px 11px 35px}.title{font-size:25px}.tools{grid-template-columns:1fr 1fr}.tools .search{grid-column:1/-1}.hero{padding:17px}.hero h2{font-size:20px}.calgrid{gap:3px}.cell{min-height:72px;padding:5px}.event{font-size:9px;padding:3px}.details{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><main class="wrap"><header class="top"><div><div class="eyebrow">RENTAL DESK · ภาพรวมงาน</div><h1 class="title">ตารางรถเช่า</h1><p class="sub">ดูงานตามวันรับรถและคืนรถได้ในหน้าเดียว</p></div><button class="btn" id="refresh">↻ รีเฟรช</button></header><section class="hero"><small>ภาพรวมวันนี้</small><h2 id="today">กำลังโหลด...</h2><div class="numbers"><div><b id="total">—</b><span>รายการ</span></div><div><b id="soon">—</b><span>ใกล้ถึง 48 ชม.</span></div><div><b id="others">—</b><span>Other</span></div></div></section><section class="panel"><div class="tools"><input class="input search" id="q" placeholder="ค้นหาชื่อ Booking รถ หรือบริษัท"><select class="select" id="source"><option value="">ทุกแหล่งข้อมูล</option><option>LINE</option><option>AppSheet</option></select><select class="select" id="kind"><option value="">ทุกประเภท</option><option value="booking">Booking</option><option value="other">Other</option></select><select class="select" id="dateType"><option value="pickup">วันรับรถ</option><option value="return">วันคืนรถ</option></select></div><div class="tabs"><button class="tab active" id="listTab">☷ รายการตามวัน</button><button class="tab" id="calTab">▦ ปฏิทิน</button></div></section><section id="list"></section><section id="calendar" class="calendar"></section></main><script>
let data=[];const $=x=>document.getElementById(x),clean=x=>x==null||x===''?'-':x;function dt(d,t){if(!d)return null;let m=String(d).match(/(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);if(!m)return null;let y=+m[1];if(y>2400)y-=543;return new Date(y,+m[2]-1,+m[3],...(String(t||'00:00').split(':').map(Number)))}function fmt(d,t){let x=dt(d,t);return x?x.toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'})+' · '+(t||'ไม่ระบุเวลา'):'ไม่ระบุวัน'}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function filtered(){let q=$('q').value.toLowerCase(),s=$('source').value,k=$('kind').value;return data.filter(r=>(!s||String(r.source_label||r.source).includes(s))&&(!k||(k==='other'?String(r.source_label||'').toLowerCase().includes('other'):!String(r.source_label||'').toLowerCase().includes('other')))&&(!q||JSON.stringify(r).toLowerCase().includes(q)))}function card(r){let other=String(r.source_label||'').toLowerCase().includes('other');return `<article class="card"><div class="summary"><i class="stripe ${other?'other':''}"></i><div><div class="line"><span class="pill ${other?'other':''}">${esc(other?'Other':r.source_label||r.source||'รายการ')}</span><span class="name">${esc(r.customer_name||r.company||'ไม่ระบุชื่อ')}</span></div><div class="meta"><span>รับ <b class="time">${esc(fmt(r.pickup_date,r.pickup_time))}</b></span><span>คืน <b class="time">${esc(fmt(r.return_date,r.return_time))}</b></span></div></div><span class="arrow">⌄</span></div><div class="details"><div class="detail"><label>Booking</label><strong>${esc(clean(r.booking_no))}</strong></div><div class="detail"><label>รถ</label><strong>${esc(clean(r.car))}</strong></div><div class="detail"><label>สถานที่รับ</label><strong>${esc(clean(r.pickup_location))}</strong></div><div class="detail"><label>สถานที่คืน</label><strong>${esc(clean(r.return_location))}</strong></div><div class="detail"><label>ลูกค้า / โทร</label><strong>${esc(clean(r.customer_name))} · ${esc(clean(r.customer_phone))}</strong></div><div class="detail"><label>ไฟล์</label><strong>${esc(clean(r.file_name))}</strong></div>${r.drive_url?`<div class="detail full"><a class="file" target="_blank" href="${esc(r.drive_url)}">เปิดไฟล์ใน Google Drive ↗</a></div>`:''}</div></article>`}function render(){let arr=filtered(),type=$('dateType').value,groups={};arr.forEach(r=>{let d=r[type+'_date']||'ไม่ระบุวัน';(groups[d]??=[]).push(r)});let keys=Object.keys(groups).sort((a,b)=>(dt(a)||new Date(8640000000000000))-(dt(b)||new Date(8640000000000000)));$('list').innerHTML=keys.length?keys.map(k=>`<section class="day"><div class="dayhead"><div class="daytitle">${esc(k==='ไม่ระบุวัน'?k:fmt(k,''))}<em>${k==='ไม่ระบุวัน'?'':'รายการ'}</em></div><span class="daycount">${groups[k].length} รายการ</span></div><div class="cards">${groups[k].map(card).join('')}</div></section>`).join(''):'<div class="empty">ไม่พบรายการ</div>';document.querySelectorAll('.summary').forEach(x=>x.onclick=()=>x.parentElement.classList.toggle('open'));$('total').textContent=arr.length;$('others').textContent=arr.filter(r=>String(r.source_label||'').toLowerCase().includes('other')).length;$('soon').textContent=arr.filter(r=>{let d=dt(r.pickup_date,r.pickup_time);return d&&d-new Date()>0&&d-new Date()<172800000}).length;$('today').textContent=new Date().toLocaleDateString('th-TH',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}function calendar(){let arr=filtered(),by={};arr.forEach(r=>{let d=dt(r.pickup_date,r.pickup_time);if(d){let k=d.toISOString().slice(0,10);(by[k]??=[]).push(r)}});let now=new Date(),y=now.getFullYear(),m=now.getMonth(),first=new Date(y,m,1),days=new Date(y,m+1,0).getDate(),cells=[];for(let i=0;i<first.getDay();i++)cells.push('<div class="cell muted"></div>');for(let n=1;n<=days;n++){let k=new Date(y,m,n).toISOString().slice(0,10);cells.push(`<div class="cell"><span class="num">${n}</span>${(by[k]||[]).map(r=>`<span class="event ${String(r.source_label||'').toLowerCase().includes('other')?'other':''}">${esc(r.customer_name||r.company||'รายการ')}</span>`).join('')}</div>`)}$('calendar').innerHTML=`<div class="monthbar"><h3>${now.toLocaleDateString('th-TH',{month:'long',year:'numeric'})}</h3><span class="daycount">ปฏิทินวันรับรถ</span></div><div class="calgrid">${['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'].map(x=>`<div class="dow">${x}</div>`).join('')}${cells.join('')}</div>`}async function load(){$('list').innerHTML='<div class="loading">กำลังโหลดข้อมูล...</div>';try{let r=await fetch('/api/bookings');data=await r.json();render();calendar()}catch(e){$('list').innerHTML='<div class="empty">โหลดข้อมูลไม่สำเร็จ</div>'}}['q','source','kind','dateType'].forEach(id=>$(id).oninput=()=>{render();calendar()});$('refresh').onclick=load;$('listTab').onclick=()=>{$('list').classList.remove('hide');$('calendar').classList.remove('show');$('listTab').classList.add('active');$('calTab').classList.remove('active')};$('calTab').onclick=()=>{$('list').classList.add('hide');$('calendar').classList.add('show');$('calTab').classList.add('active');$('listTab').classList.remove('active')};load();
</script></body></html>
