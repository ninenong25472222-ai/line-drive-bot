<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Rental Desk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --ink:#202538; --muted:#77809a; --bg:#f6f8fc; --card:#fff; --purple:#7556d8; --mint:#26ad8f; --line:#e8ebf3; }
    *{box-sizing:border-box} body{margin:0;background:linear-gradient(180deg,#f0edff 0,#f7f9fd 38%,#f7f9fd 100%);color:var(--ink);font-family:Prompt,system-ui,sans-serif}
    .wrap{max-width:1100px;margin:auto;padding:22px 16px 42px}.hero{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px}.eyebrow{color:var(--purple);font-size:13px;font-weight:600}.title{font-size:clamp(25px,5vw,38px);margin:2px 0 4px;letter-spacing:-.5px}.sub{color:var(--muted);margin:0;font-size:14px}.refresh{border:0;border-radius:14px;background:#fff;color:var(--purple);padding:11px 14px;box-shadow:0 8px 25px #5340a515;font:inherit;cursor:pointer}.panel{background:#ffffffcc;backdrop-filter:blur(12px);border:1px solid #fff;border-radius:22px;padding:14px;box-shadow:0 14px 35px #4c3b9820;margin-bottom:16px}.toolbar{display:grid;grid-template-columns:1.5fr 1fr 1fr auto;gap:10px}.input,.select{width:100%;border:1px solid var(--line);border-radius:13px;background:#fff;padding:12px 13px;color:var(--ink);font:inherit;outline:none}.input:focus,.select:focus{border-color:var(--purple);box-shadow:0 0 0 3px #7556d820}.stats{display:flex;gap:10px;overflow:auto;margin-top:12px}.stat{min-width:120px;border-radius:16px;padding:11px 13px;background:#f7f5ff}.stat b{display:block;font-size:20px}.stat span{color:var(--muted);font-size:12px}.list{display:grid;gap:11px}.empty{text-align:center;color:var(--muted);padding:42px 10px}.row{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 7px 18px #3e4a7910}.summary{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:14px 15px;cursor:pointer}.mainline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.badge{font-size:11px;padding:4px 8px;border-radius:999px;background:#eee9ff;color:#6446c6}.badge.other{background:#fff0e5;color:#bd6b29}.name{font-weight:600}.meta{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:5px}.date{font-weight:600;color:var(--ink);white-space:nowrap}.chev{font-size:20px;color:var(--muted);transition:.2s}.row.open .chev{transform:rotate(180deg)}.details{display:none;border-top:1px solid var(--line);padding:14px 15px;background:#fbfcff}.row.open .details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.detail label{display:block;color:var(--muted);font-size:11px}.detail strong{font-size:13px;word-break:break-word}.detail.full{grid-column:1/-1}.file{display:inline-flex;margin-top:10px;text-decoration:none;color:#fff;background:var(--purple);padding:9px 12px;border-radius:11px;font-size:13px}.loading{color:var(--muted);padding:24px;text-align:center}
    @media(max-width:650px){.wrap{padding:16px 12px 32px}.hero{align-items:center}.refresh{padding:9px 11px}.toolbar{grid-template-columns:1fr 1fr}.toolbar .search{grid-column:1/-1}.row.open .details{grid-template-columns:1fr}.summary{padding:13px}.date{font-size:12px}}
  </style>
</head>
<body><main class="wrap">
  <header class="hero"><div><div class="eyebrow">RENTAL DESK · ภาพรวมงาน</div><h1 class="title">รายการรถเช่า</h1><p class="sub">รวมข้อมูลจาก LINE และ AppSheet ในหน้าจอเดียว</p></div><button class="refresh" id="refresh">↻ รีเฟรช</button></header>
  <section class="panel"><div class="toolbar"><input class="input search" id="search" placeholder="ค้นหาชื่อ, Booking, รถ, บริษัท..."/><select class="select" id="source"><option value="">ทุกแหล่งข้อมูล</option><option value="LINE">LINE</option><option value="AppSheet">AppSheet</option></select><select class="select" id="kind"><option value="">ทั้งหมด</option><option value="booking">Booking</option><option value="other">Other</option></select><select class="select" id="sort"><option value="pickup">เรียงวันรับรถ</option><option value="return">เรียงวันคืนรถ</option></select></div><div class="stats"><div class="stat"><b id="total">—</b><span>รายการทั้งหมด</span></div><div class="stat"><b id="soon">—</b><span>ใกล้ถึงใน 48 ชม.</span></div><div class="stat"><b id="other">—</b><span>Other</span></div></div></section>
  <section id="list" class="list"><div class="loading">กำลังโหลดข้อมูล...</div></section>
</main><script>
let rows=[]; const $=id=>document.getElementById(id); const val=x=>x==null||x===''?'-':x;
function dateTime(date,time){if(!date)return null; const s=String(date).trim(); const m=s.match(/(\d{4})[-/](\d{1,2})[-/](\d{1,2})/); if(!m)return null; let y=+m[1]; if(y>2400)y-=543; return new Date(y,+m[2]-1,+m[3],...(String(time||'00:00').split(':').map(Number)))}
function fmt(d,t){const x=dateTime(d,t);return x?x.toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'})+' · '+(t||'ไม่ระบุเวลา'):'ไม่ระบุวัน'}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function render(){const q=$('search').value.toLowerCase();const source=$('source').value;const kind=$('kind').value;const sort=$('sort').value;const filtered=rows.filter(r=>(!source||String(r.source_label||r.source).toLowerCase().includes(source.toLowerCase()))&&(!kind||(kind==='other'?String(r.source_label||'').toLowerCase().includes('other'):!String(r.source_label||'').toLowerCase().includes('other')))&&(!q||JSON.stringify(r).toLowerCase().includes(q))).sort((a,b)=>(dateTime(a[sort+'_date'],a[sort+'_time'])||new Date(8640000000000000))-(dateTime(b[sort+'_date'],b[sort+'_time'])||new Date(8640000000000000))); $('total').textContent=filtered.length;$('other').textContent=filtered.filter(r=>String(r.source_label||'').toLowerCase().includes('other')).length;$('soon').textContent=filtered.filter(r=>{const d=dateTime(r.pickup_date,r.pickup_time);return d&&d-new Date()>0&&d-new Date()<172800000}).length; $('list').innerHTML=filtered.length?filtered.map((r,i)=>`<article class="row" data-i="${i}"><div class="summary"><div><div class="mainline"><span class="badge ${String(r.source_label||'').toLowerCase().includes('other')?'other':''}">${esc(r.source_label||r.source||'รายการ')}</span><span class="name">${esc(r.customer_name||r.company||'ไม่ระบุชื่อ')}</span></div><div class="meta"><span>รับ ${esc(fmt(r.pickup_date,r.pickup_time))}</span><span>คืน ${esc(fmt(r.return_date,r.return_time))}</span></div></div><span class="chev">⌄</span></div><div class="details"><div class="detail"><label>Booking</label><strong>${esc(val(r.booking_no))}</strong></div><div class="detail"><label>รถ</label><strong>${esc(val(r.car))}</strong></div><div class="detail"><label>สถานที่รับ</label><strong>${esc(val(r.pickup_location))}</strong></div><div class="detail"><label>สถานที่คืน</label><strong>${esc(val(r.return_location))}</strong></div><div class="detail"><label>ลูกค้า / โทร</label><strong>${esc(val(r.customer_name))} · ${esc(val(r.customer_phone))}</strong></div><div class="detail"><label>ไฟล์</label><strong>${esc(val(r.file_name))}</strong></div>${r.drive_url?`<div class="detail full"><a class="file" target="_blank" href="${esc(r.drive_url)}">เปิดไฟล์ใน Google Drive ↗</a></div>`:''}</div></article>`).join(''):'<div class="empty">ไม่พบรายการที่ค้นหา</div>';document.querySelectorAll('.summary').forEach(x=>x.onclick=()=>x.parentElement.classList.toggle('open'))}
async function load(){ $('list').innerHTML='<div class="loading">กำลังโหลดข้อมูล...</div>';try{const r=await fetch('/api/bookings');if(!r.ok)throw Error();rows=await r.json();render()}catch(e){$('list').innerHTML='<div class="empty">โหลดข้อมูลไม่สำเร็จ กรุณาตรวจ Netlify Functions และค่า Supabase</div>'}}
['search','source','kind','sort'].forEach(id=>$(id).addEventListener('input',render));$('refresh').onclick=load;load();
</script></body></html>
