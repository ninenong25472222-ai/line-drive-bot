<!doctype html><html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rental Desk</title><style>body{margin:0;background:#f5f9fc;color:#183047;font-family:Arial,sans-serif}.app{max-width:1100px;margin:auto;padding:18px 12px}.top{display:flex;justify-content:space-between}.ey{color:#188bd0;font-weight:bold;font-size:12px}.h{font-size:28px;margin:4px 0}.muted{color:#718398;font-size:13px}.btn,.ctl{font:inherit;border-radius:11px}.btn{border:0;padding:10px 14px;color:#188bd0;background:#fff}.hero{margin:14px 0;padding:20px;border-radius:22px;color:#fff;background:linear-gradient(120deg,#126da7,#44afe6)}.stats{display:flex;gap:25px}.stats b{display:block;font-size:24px}.stats span{font-size:11px}.panel,.day{background:#fff;border:1px solid #dceaf3;border-radius:18px}.panel{padding:12px}.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px}.ctl{border:1px solid #dceaf3;padding:11px;min-width:0}.day{margin:14px 0;overflow:hidden}.dh{padding:13px;background:#f1faff;border-bottom:1px solid #dceaf3;display:flex;justify-content:space-between}.cards{padding:10px;display:grid;gap:8px}.card{border:1px solid #dceaf3;border-radius:13px;overflow:hidden}.sum{display:grid;grid-template-columns:7px 1fr auto;gap:10px;padding:13px;cursor:pointer}.bar{background:#188bd0}.bar.o{background:#9a86d6}.badge{font-size:10px;background:#e9f6ff;color:#126b9f;border-radius:99px;padding:3px 8px}.badge.o{background:#fff0e3;color:#b8621e}.name{font-weight:bold;font-size:14px}.meta{color:#718398;font-size:11px;margin-top:5px}.det{display:none;grid-template-columns:1fr 1fr;gap:10px;padding:13px;background:#fbfdff;border-top:1px solid #dceaf3;font-size:12px}.open .det{display:grid}.det label{display:block;color:#718398;font-size:10px}.wide{grid-column:1/-1}.drive{background:#f28d3d;color:#fff;padding:8px;border-radius:9px;text-decoration:none}@media(max-width:700px){.filters{grid-template-columns:1fr 1fr}.search{grid-column:1/-1}.det{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><main class="app"><header class="top"><div><div class="ey">RENTAL DESK · ภาพรวมงาน</div><h1 class="h">ตารางรถเช่า</h1><div class="muted">วันรับรถและคืนรถในหน้าเดียว</div></div><button class="btn" id="refresh">↻ รีเฟรช</button></header><section class="hero"><small>ภาพรวมรายการ</small><h2 id="today">กำลังโหลด...</h2><div class="stats"><div><b id="total">—</b><span>รายการ</span></div><div><b id="soon">—</b><span>ภายใน 48 ชม.</span></div><div><b id="others">—</b><span>Other</span></div></div></section><section class="panel"><div class="filters"><input class="ctl search" id="q" placeholder="ค้นหาชื่อ Booking รถ หรือโทร"><select class="ctl" id="source"><option value="">ทุกแหล่งข้อมูล</option><option>LINE</option><option>AppSheet</option></select><select class="ctl" id="kind"><option value="">ทุกประเภท</option><option value="booking">Booking</option><option value="other">Other</option></select><select class="ctl" id="type"><option value="pickup">เรียงวันรับรถ</option><option value="return">เรียงวันคืนรถ</option></select></div></section><button class="btn" id="calbtn">▦ ปฏิทิน</button><section id="list"></section><section id="calendar" style="display:none;background:#fff;border:1px solid #dceaf3;border-radius:18px;padding:14px;margin-top:14px"><h3>ปฏิทินวันรับรถ</h3><div id="calgrid" style="display:grid;grid-template-columns:repeat(7,1fr);gap:5px"></div></section></main><script>var data=[];function $(x){return document.getElementById(x)}function oth(r){return String(r.source_label||'').toLowerCase().indexOf('other')>=0}function esc(x){return String(x||'').replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}function dt(v){var m=String(v||'').match(/(\d{4})[-/](\d{1,2})[-/](\d{1,2})/);if(!m)return null;var y=+m[1];if(y>2400)y-=543;return new Date(y,+m[2]-1,+m[3])}function txt(v,t){var d=dt(v);return d?d.toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'})+(t?' · '+t:''):'ไม่ระบุวัน'}function rows(){var q=$("q").value.toLowerCase(),s=$("source").value,k=$("kind").value;return data.filter(function(r){return(!s||String(r.source_label||r.source).indexOf(s)>=0)&&(!k||(k==='other'?oth(r):!oth(r)))&&(!q||JSON.stringify(r).toLowerCase().indexOf(q)>=0)})}function make(r){var o=oth(r),a=document.createElement('article');a.className='card';a.innerHTML='<div class="sum"><i class="bar '+(o?'o':'')+'"></i><div><span class="badge '+(o?'o':'')+'">'+esc(o?'Other':r.source_label||r.source||'รายการ')+'</span> <span class="name">'+esc(r.customer_name||r.company||'ไม่ระบุชื่อ')+'</span><div class="meta">รับ <b>'+txt(r.pickup_date,r.pickup_time)+'</b> · คืน <b>'+txt(r.return_date,r.return_time)+'</b></div></div><span>⌄</span></div><div class="det"><div><label>Booking</label><b>'+esc(r.booking_no||'-')+'</b></div><div><label>รถ</label><b>'+esc(r.car||'-')+'</b></div><div><label>สถานที่รับ</label><b>'+esc(r.pickup_location||'-')+'</b></div><div><label>สถานที่คืน</label><b>'+esc(r.return_location||'-')+'</b></div><div><label>ลูกค้า / โทร</label><b>'+esc((r.customer_name||'-')+' · '+(r.customer_phone||'-'))+'</b></div><div><label>ไฟล์</label><b>'+esc(r.file_name||'-')+'</b></div>'+(r.drive_url?'<div class="wide"><a class="drive" target="_blank" href="'+esc(r.drive_url)+'">เปิดไฟล์ Google Drive ↗</a></div>':'')+'</div>';a.querySelector('.sum').onclick=function(){a.classList.toggle('open')};return a}function render(){var a=rows(),t=$("type").value,g={};a.forEach(function(r){var k=r[t+'_date']||'ไม่ระบุวัน';(g[k]||(g[k]=[])).push(r)});var l=$("list");l.innerHTML='';Object.keys(g).sort(function(a,b){return(dt(a)||new Date(8640000000000000))-(dt(b)||new Date(8640000000000000))}).forEach(function(k){var s=document.createElement('section');s.className='day';s.innerHTML='<div class="dh"><b>'+esc(k==='ไม่ระบุวัน'?k:txt(k,''))+'</b><span class="muted">'+g[k].length+' รายการ</span></div><div class="cards"></div>';g[k].forEach(function(r){s.querySelector('.cards').appendChild(make(r))});l.appendChild(s)});$("total").textContent=a.length;$("others").textContent=a.filter(oth).length;$("soon").textContent=0;$("today").textContent=new Date().toLocaleDateString('th-TH',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}function load(){fetch('/api/bookings').then(function(r){return r.json()}).then(function(x){data=x;render()}).catch(function(){$("list").innerHTML='<div class="muted" style="padding:40px;text-align:center">โหลดข้อมูลไม่สำเร็จ</div>'})}["q","source","kind","type"].forEach(function(id){$(id).oninput=render});$("refresh").onclick=load;function showCalendar(){var box=$("calendar"),grid=$("calgrid"),n=new Date(),y=n.getFullYear(),m=n.getMonth(),days=new Date(y,m+1,0).getDate(),out="<b style='grid-column:1/-1'>"+n.toLocaleDateString("th-TH",{month:"long",year:"numeric"})+"</b>";for(var i=0;i<new Date(y,m,1).getDay();i++)out+="<span></span>";for(var d=1;d<=days;d++){var k=new Date(y,m,d).toISOString().slice(0,10),hits=data.filter(function(r){var x=dt(r.pickup_date);return x&&x.toISOString().slice(0,10)==k});out+="<div style='min-height:55px;border:1px solid #dceaf3;border-radius:8px;padding:5px'><b>"+d+"</b>"+hits.map(function(r){return "<small style='display:block;background:#e9f6ff;margin-top:3px;padding:2px;border-radius:4px;overflow:hidden'>"+esc(r.customer_name||r.company||"รายการ")+"</small>"}).join("")+"</div>"}grid.innerHTML=out}$("calbtn").onclick=function(){var x=$("calendar");x.style.display=x.style.display==="none"?"block":"none";if(x.style.display==="block")showCalendar()};load();</script></body></html>
