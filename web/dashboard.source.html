<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rental Desk</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#14293d;--mut:#66788b;--paper:#f4f8fb;--card:#fff;--line:#d9e6ef;--p:#1478b8;--r:#0f8a6a;--o:#7b61c9;--warn:#b45309;--warnbg:#fff3df;--err:#b42318}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 'IBM Plex Sans Thai',Tahoma,sans-serif}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid #6db4e6;outline-offset:2px}
.app{max-width:920px;margin:0 auto;padding:16px 14px 60px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.topActions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
h1{font-size:26px;line-height:1.2;margin:0}
.muted{color:var(--mut);font-size:13px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:11px;padding:9px 14px;min-height:42px;font-weight:500}
.btn:disabled{opacity:.55;cursor:default}
.btn.on{background:var(--ink);border-color:var(--ink);color:#fff}
.today{margin:16px 0 10px;font-size:18px;font-weight:600}
.stats{display:flex;flex-wrap:wrap;gap:8px 22px;padding:12px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin-bottom:14px}
.stats div{min-width:92px}.stats b{font-size:22px;font-weight:700;display:block;line-height:1.2}.stats span{font-size:12px;color:var(--mut)}
.stats .w b{color:var(--warn)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr 1fr;gap:8px}
.ctl{width:100%;min-width:0;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff;min-height:44px}
.row2{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:12px 0}
.chip{display:inline-flex;align-items:center;gap:8px;background:#e8f3fb;color:#0f5f93;border:0;border-radius:99px;padding:6px 14px;font-weight:500}
.err{background:#fdecea;border:1px solid #f5c2bd;color:var(--err);border-radius:12px;padding:12px 14px;margin:12px 0;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.login{max-width:380px;margin:18px auto;display:grid;gap:10px}.login h2{margin:0;font-size:18px}
.login .go{background:var(--p);color:#fff;border:0;border-radius:11px;min-height:46px;font-weight:600}
.day{margin:16px 0}
.dh{position:sticky;top:0;z-index:4;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;background:#e9f2f8;border-radius:11px;font-weight:600;margin-bottom:8px}
.dh.td{background:var(--ink);color:#fff}.dh.td .muted{color:#c9d8e4}
.dh.bad{background:var(--warnbg);color:var(--warn)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:8px;overflow:hidden}
.sum{display:grid;grid-template-columns:5px 56px 1fr 20px;gap:10px;align-items:start;width:100%;text-align:left;border:0;background:none;padding:12px 12px 12px 0}
.bar{background:var(--p);align-self:stretch;border-radius:0 4px 4px 0}.card.r .bar{background:var(--r)}.card.o .bar{background:var(--o)}
.tm{font-size:19px;font-weight:700;line-height:1.3}
.mn{display:block;min-width:0}
.tag,.badge{display:inline-block;font-size:11px;font-weight:600;border-radius:99px;padding:1px 9px;margin-right:4px;vertical-align:1px}
.tag.p{background:#e3f1fa;color:#0f5f93}.tag.r{background:#dff3ec;color:#0b6b52}
.badge{background:#eef1f5;color:#4b5b6b}.badge.o{background:#ece7fa;color:#5a42a8}.badge.w{background:var(--warnbg);color:var(--warn)}
.name{display:block;font-weight:600;margin-top:2px}
.meta{display:block;color:var(--mut);font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chev{color:var(--mut);transition:transform .2s}.open .chev{transform:rotate(180deg)}
.det{display:none;grid-template-columns:1fr 1fr;gap:10px 14px;padding:12px 14px;background:#fbfdff;border-top:1px solid var(--line);font-size:14px}
.open .det{display:grid}
.det label{display:block;color:var(--mut);font-size:12px}.det b{font-weight:500;word-break:break-word}
.wide{grid-column:1/-1}.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts a{display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:10px;background:#e8f3fb;color:#0f5f93;font-weight:600;text-decoration:none}
.acts a.drive{background:#fdebd8;color:#9a4a0b}
.acts button{border:0;display:inline-flex;align-items:center;min-height:40px;padding:0 14px;border-radius:10px;background:#e8f3fb;color:#0f5f93;font-weight:600}
.acts button.edit{background:#e8f3fb;color:#0f5f93}.acts button:disabled{opacity:.55;cursor:not-allowed}
.modalBg{position:fixed;inset:0;z-index:10;background:rgba(20,41,61,.42);padding:18px;display:flex;align-items:flex-start;justify-content:center;overflow:auto}
.modal{width:min(680px,100%);margin:5vh auto;background:#fff;border-radius:16px;padding:18px;box-shadow:0 20px 60px rgba(20,41,61,.25)}
.modalHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.modalHead h2{margin:0;font-size:20px}
.editGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.editGrid label{display:grid;gap:4px;color:var(--mut);font-size:13px}.editGrid label.wide{grid-column:1/-1}
.modalFoot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.save{background:var(--p);border-color:var(--p);color:#fff}
.more{display:block;margin:12px auto}
.empty{text-align:center;color:var(--mut);padding:40px 12px}
.sk{height:64px;border-radius:14px;margin-bottom:8px;background:linear-gradient(90deg,#fff 25%,#e9f2f8 50%,#fff 75%);background-size:200% 100%;animation:sh 1.2s infinite}@keyframes sh{to{background-position:-200% 0}}
.calh{display:flex;align-items:center;gap:8px;margin-bottom:10px}.calh b{flex:1;text-align:center}
.calg{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cw{text-align:center;font-size:12px;color:var(--mut)}
.cd{min-height:64px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:4px;text-align:left;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.cd b{font-size:13px}.cd.td{border-color:var(--p);box-shadow:inset 0 0 0 1px var(--p)}.cd.sel{background:#e3f1fa}
.cd small{font-size:10.5px;line-height:1.3;border-radius:4px;padding:0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cd .cp{background:#e3f1fa;color:#0f5f93}.cd .cr{background:#dff3ec;color:#0b6b52}.cd .mo{color:var(--mut)}
@media(max-width:700px){.filters{grid-template-columns:1fr 1fr}.search{grid-column:1/-1}.det{grid-template-columns:1fr}.wide{grid-column:auto}.cd small{font-size:9.5px}.cd{min-height:56px}.editGrid{grid-template-columns:1fr}.topActions{justify-content:flex-start}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="app">
<header class="top">
  <div><h1>Rental Desk</h1><div class="muted" id="upd">กำลังโหลด…</div></div>
  <div class="topActions">
    <button class="btn" id="billingBtn" type="button" disabled title="เตรียมไว้สำหรับเวอร์ชันถัดไป">ออกบิล (เร็วๆ นี้)</button>
    <button class="btn" id="rf">↻ รีเฟรช</button>
  </div>
</header>

<div class="err" id="err" role="alert" hidden><span id="errMsg"></span><button class="btn" id="retry">ลองใหม่</button></div>

<form class="panel login" id="login" hidden>
  <h2>เข้าสู่ระบบ</h2>
  <label class="muted" for="em">อีเมล</label><input class="ctl" id="em" type="email" autocomplete="username" required>
  <label class="muted" for="pw">รหัสผ่าน</label><input class="ctl" id="pw" type="password" autocomplete="current-password" required>
  <div class="muted" id="loginErr" style="color:var(--err)" role="alert"></div>
  <button class="go" type="submit">เข้าสู่ระบบ</button>
</form>

<div id="main">
  <div class="today" id="today"></div>
  <div class="stats">
    <div><b id="sTotal">—</b><span>รายการ</span></div>
    <div><b id="sSoon">—</b><span>รับ/คืน ภายใน 48 ชม.</span></div>
    <div><b id="sOther">—</b><span>Other</span></div>
    <div class="w"><b id="sBad">—</b><span>ข้อมูลวันที่ไม่ครบ</span></div>
  </div>

  <section class="panel filters">
    <input class="ctl search" id="q" type="search" placeholder="ค้นหาชื่อ เลขจอง รถ เบอร์โทร สถานที่" aria-label="ค้นหา">
    <select class="ctl" id="period" aria-label="ช่วงเวลา">
      <option value="upcoming">ตั้งแต่วันนี้</option><option value="today">เฉพาะวันนี้</option><option value="week">7 วันข้างหน้า</option>
      <option value="month">30 วันข้างหน้า</option><option value="past">ที่ผ่านมาแล้ว</option><option value="all">ทั้งหมด</option>
    </select>
    <select class="ctl" id="mode" aria-label="ประเภทงาน">
      <option value="both">รับและคืนรถ</option><option value="pickup">เฉพาะรับรถ</option><option value="return">เฉพาะคืนรถ</option>
    </select>
    <select class="ctl" id="source" aria-label="แหล่งข้อมูล"><option value="">ทุกแหล่งข้อมูล</option></select>
    <select class="ctl" id="kind" aria-label="ชนิดรายการ">
      <option value="">Booking + Other</option><option value="booking">เฉพาะ Booking</option><option value="other">เฉพาะ Other</option>
    </select>
  </section>

  <div class="row2">
    <button class="btn" id="calbtn" aria-expanded="false" aria-controls="calendar">▦ ปฏิทิน</button>
    <button class="chip" id="dayChip" hidden></button>
  </div>

  <section class="panel" id="calendar" hidden>
    <div class="calh">
      <button class="btn" id="cPrev" aria-label="เดือนก่อน">‹</button><b id="calTitle"></b>
      <button class="btn" id="cNext" aria-label="เดือนถัดไป">›</button><button class="btn" id="cToday">เดือนนี้</button>
    </div>
    <div class="calg" id="calgrid"></div>
    <div class="muted" style="margin-top:8px">▲ รับรถ · ▼ คืนรถ · แตะวันที่เพื่อดูเฉพาะวันนั้น</div>
  </section>

  <section id="list" aria-live="polite"></section>
</div>
</main>

<div class="modalBg" id="editModal" hidden>
  <form class="modal" id="editForm">
    <div class="modalHead"><h2>แก้ไขข้อมูลการจอง</h2><button class="btn" id="editClose" type="button">ปิด</button></div>
    <p class="muted">แก้ไขข้อมูลรายการเท่านั้น ไฟล์ต้นฉบับใน Google Drive จะไม่ถูกแก้ไข</p>
    <div class="editGrid">
      <label>ชื่อลูกค้า<input class="ctl" name="customer_name" required></label>
      <label>เบอร์โทร<input class="ctl" name="customer_phone" inputmode="tel"></label>
      <label>เลขจอง<input class="ctl" name="booking_no"></label>
      <label>รถ<input class="ctl" name="car"></label>
      <label>วันรับรถ<input class="ctl" name="pickup_date" type="date"></label>
      <label>เวลารับรถ<input class="ctl" name="pickup_time" type="time"></label>
      <label class="wide">สถานที่รับรถ<input class="ctl" name="pickup_location"></label>
      <label>วันคืนรถ<input class="ctl" name="return_date" type="date"></label>
      <label>เวลาคืนรถ<input class="ctl" name="return_time" type="time"></label>
      <label class="wide">สถานที่คืนรถ<input class="ctl" name="return_location"></label>
      <label>สถานะ<select class="ctl" name="status"><option value="รอตรวจสอบ">รอตรวจสอบ</option><option value="ยืนยันแล้ว">ยืนยันแล้ว</option><option value="ผิดพลาด">ผิดพลาด — รอย้ายเข้าคิวลบ</option><option value="ยกเลิก">ยกเลิก — รอย้ายเข้าคิวลบ</option></select></label>
      <label class="wide">รหัสผู้ดูแล<input class="ctl" name="edit_token" type="password" autocomplete="current-password" required></label>
    </div>
    <div class="muted" id="editErr" role="alert"></div>
    <div class="modalFoot"><button class="btn" id="editCancel" type="button">ยกเลิก</button><button class="btn save" id="editSave" type="submit">บันทึกข้อมูล</button></div>
  </form>
</div>

<script>
/* ====== ตั้งค่า ====== */
var CONFIG = {
  // โหมด 1: เรียก API ของคุณเอง (ต้องส่ง JSON array ที่มีฟิลด์ตามด้านล่าง)
  API_URL: '/api/bookings',
  SUPABASE_URL: '',
  SUPABASE_ANON_KEY: '',
  TABLE: 'bookings',
  REQUIRE_LOGIN: false,      // เปิดดู Dashboard ได้ทันที
  EDIT_API_URL: '/api/bookings', // กดแก้ไขแล้วจะขอรหัสผู้ดูแลเฉพาะครั้ง
  LOOKBACK_DAYS: 90          // ดึงเฉพาะรายการที่คืนรถไม่เกินกี่วันก่อน (0 = ดึงทั้งหมด)
};
/* ฟิลด์ที่หน้านี้ใช้: customer_name, company, customer_phone, booking_no, car,
   pickup_date, pickup_time, pickup_location, return_date, return_time, return_location,
   source_label (หรือ source), file_name, drive_url */

var $ = function (id) { return document.getElementById(id); };
var SB = !!CONFIG.SUPABASE_URL;
var rows = [], loading = false, LIMIT = 150, lastLoad = 0;
var view = { day: '', cal: null, editingId: '' };

/* ====== ตัวช่วย ====== */
var esc = function (v) { return String(v == null ? '' : v).replace(/[&<>"'`]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;', '`': '&#96;' }[c]; }); };
var safeUrl = function (u) { u = String(u || '').trim(); return /^https:\/\//i.test(u) ? u : ''; };
var telOf = function (p) { return String(p || '').replace(/[^0-9+]/g, ''); };
var pad = function (n) { return String(n).padStart(2, '0'); };
function todayISO() { return new Intl.DateTimeFormat('en-CA', { timeZone: 'Asia/Bangkok' }).format(new Date()); }
function addDays(iso, n) { var d = new Date(iso + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function thaiDate(iso, o) { return new Date(iso + 'T00:00:00Z').toLocaleDateString('th-TH', Object.assign({ timeZone: 'UTC' }, o || { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' })); }
function mkISO(y, m, d) {
  if (y > 2400) y -= 543;
  var t = new Date(Date.UTC(y, m - 1, d));
  if (t.getUTCFullYear() !== y || t.getUTCMonth() !== m - 1 || t.getUTCDate() !== d) return '';
  return String(y).padStart(4, '0') + '-' + pad(m) + '-' + pad(d);
}
function pdate(v) {                       // รองรับ yyyy-mm-dd, yyyy/m/d, dd/mm/yyyy, dd-mm-yyyy, วันภาษาไทย, ปี พ.ศ.
  var s = String(v == null ? '' : v).trim(), m;
  if ((m = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/))) return mkISO(+m[1], +m[2], +m[3]);
  if ((m = s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{4})/))) return mkISO(+m[3], +m[2], +m[1]);
  var thaiMonths = { 'ม.ค.': 1, 'ก.พ.': 2, 'มี.ค.': 3, 'เม.ย.': 4, 'พ.ค.': 5, 'มิ.ย.': 6, 'ก.ค.': 7, 'ส.ค.': 8, 'ก.ย.': 9, 'ต.ค.': 10, 'พ.ย.': 11, 'ธ.ค.': 12,
    'มกราคม': 1, 'กุมภาพันธ์': 2, 'มีนาคม': 3, 'เมษายน': 4, 'พฤษภาคม': 5, 'มิถุนายน': 6, 'กรกฎาคม': 7, 'สิงหาคม': 8, 'กันยายน': 9, 'ตุลาคม': 10, 'พฤศจิกายน': 11, 'ธันวาคม': 12 };
  var compact = s.replace(/\s+/g, '');
  m = compact.match(/^(\d{1,2})(ม\.ค\.|ก\.พ\.|มี\.ค\.|เม\.ย\.|พ\.ค\.|มิ\.ย\.|ก\.ค\.|ส\.ค\.|ก\.ย\.|ต\.ค\.|พ\.ย\.|ธ\.ค\.|มกราคม|กุมภาพันธ์|มีนาคม|เมษายน|พฤษภาคม|มิถุนายน|กรกฎาคม|สิงหาคม|กันยายน|ตุลาคม|พฤศจิกายน|ธันวาคม)(\d{4})/);
  if (m && thaiMonths[m[2]]) return mkISO(+m[3], thaiMonths[m[2]], +m[1]);
  return '';
}
function ptime(v) {                       // 09:30:00 / 9.30 → 09:30
  var m = String(v == null ? '' : v).match(/(\d{1,2})[:.](\d{2})/);
  return m && +m[1] < 24 && +m[2] < 60 ? pad(+m[1]) + ':' + m[2] : '';
}
function prep(r) {
  var o = Object.assign({}, r);
  o._p = pdate(r.pickup_date); o._r = pdate(r.return_date);
  o._pt = ptime(r.pickup_time); o._rt = ptime(r.return_time);
  o._src = String(r.source_label || r.source || '');
  o._oth = o._src.toLowerCase().indexOf('other') >= 0;
  o._bad = !o._p || !o._r;
  o._idx = [r.customer_name, r.company, r.booking_no, r.car, r.customer_phone, r.pickup_location, r.return_location, r.file_name].join(' ').toLowerCase();
  return o;
}

/* ====== ตัวกรอง / รายการงาน ====== */
function base() {
  var q = $('q').value.toLowerCase().trim(), s = $('source').value, k = $('kind').value;
  return rows.filter(function (r) {
    return (!s || r._src === s) && (!k || (k === 'other') === r._oth) && (!q || r._idx.indexOf(q) >= 0);
  });
}
function events(list) {
  var m = $('mode').value, out = [];
  list.forEach(function (r) {
    var e = [];
    if (m !== 'return') e.push({ r: r, t: 'p', d: r._p, tm: r._pt });
    if (m !== 'pickup') e.push({ r: r, t: 'r', d: r._r, tm: r._rt });
    var dated = e.filter(function (x) { return x.d; });
    if (dated.length) out = out.concat(dated); else out.push(e[0]);   // ไม่มีวันเลย → แสดงครั้งเดียว
  });
  return out;
}
function inPeriod(e, today) {
  if (view.day) return e.d === view.day;
  var p = $('period').value;
  if (!e.d) return p === 'all' || p === 'upcoming';
  if (p === 'all') return true;
  if (p === 'past') return e.d < today;
  if (p === 'upcoming') return e.d >= today;
  if (p === 'today') return e.d === today;
  return e.d >= today && e.d <= addDays(today, p === 'week' ? 6 : 29);
}
function inWin(d, t) {
  var ts = Date.parse(d + 'T' + (t || '23:59') + ':00+07:00'), now = Date.now();
  return ts >= now && ts <= now + 48 * 3600000;
}
function editToken() { try { return sessionStorage.getItem('rd_edit_token') || ''; } catch (e) { return ''; } }

function card(e) {
  var r = e.r, p = e.t === 'p', place = p ? r.pickup_location : r.return_location;
  var url = safeUrl(r.drive_url), tel = telOf(r.customer_phone);
  var map = place ? 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(place) : '';
  var when = function (d, t) { return d ? thaiDate(d, { day: 'numeric', month: 'short', year: 'numeric' }) + (t ? ' · ' + t : '') : 'ไม่ระบุวัน'; };
  return '<article class="card ' + (r._oth ? 'o ' : '') + e.t + '">' +
    '<button class="sum" type="button" aria-expanded="false"><i class="bar"></i><span class="tm">' + esc(e.tm || '--:--') + '</span>' +
    '<span class="mn"><span class="tag ' + e.t + '">' + (p ? 'รับรถ' : 'คืนรถ') + '</span>' +
    (r._oth ? '<span class="badge o">Other</span>' : (r._src ? '<span class="badge">' + esc(r._src) + '</span>' : '')) +
    (r._bad ? '<span class="badge w">ข้อมูลไม่ครบ</span>' : '') +
    '<span class="name">' + esc(r.customer_name || r.company || 'ไม่ระบุชื่อ') + '</span>' +
    '<span class="meta">🚗 ' + esc(r.car || 'ยังไม่ระบุรถ') + ' · 📍 ' + esc(place || 'ไม่ระบุสถานที่') + '</span></span>' +
    '<span class="chev" aria-hidden="true">⌄</span></button>' +
    '<div class="det">' +
    '<div><label>เลขจอง</label><b>' + esc(r.booking_no || '-') + '</b></div>' +
    '<div><label>ลูกค้า / โทร</label><b>' + esc((r.customer_name || '-') + ' · ' + (r.customer_phone || '-')) + '</b></div>' +
    '<div><label>รับรถ</label><b>' + esc(when(r._p, r._pt)) + '<br>' + esc(r.pickup_location || '-') + '</b></div>' +
    '<div><label>คืนรถ</label><b>' + esc(when(r._r, r._rt)) + '<br>' + esc(r.return_location || '-') + '</b></div>' +
    (r.file_name ? '<div class="wide"><label>ไฟล์</label><b>' + esc(r.file_name) + '</b></div>' : '') +
    '<div class="wide acts">' + (tel ? '<a href="tel:' + esc(tel) + '">โทร</a>' : '') +
    (map ? '<a href="' + esc(map) + '" target="_blank" rel="noopener noreferrer">แผนที่</a>' : '') +
    (url ? '<a class="drive" href="' + esc(url) + '" target="_blank" rel="noopener noreferrer">เปิดดูไฟล์</a>' : '<button type="button" disabled>ไม่มีไฟล์แนบ</button>') +
    (r.id && url ? '<button class="reparse" type="button" data-reparse="' + esc(r.id) + '">อ่านไฟล์อีกครั้ง</button>' : '') +
    (r.id ? '<button class="edit" type="button" data-edit="' + esc(r.id) + '">แก้ไขข้อมูล</button>' : '') + '</div>' +
    '</div></article>';
}

function render() {
  var today = todayISO(), list = base(), p = $('period').value;
  var ev = events(list).filter(function (e) { return inPeriod(e, today); });
  var sign = (!view.day && p === 'past') ? -1 : 1;
  ev.sort(function (a, b) {
    return sign * (a.d || '9999').localeCompare(b.d || '9999') ||
      (a.tm || '99:99').localeCompare(b.tm || '99:99') || a.t.localeCompare(b.t);
  });
  // สถิติ
  $('today').textContent = 'วันนี้ ' + thaiDate(today);
  $('sTotal').textContent = list.length;
  $('sOther').textContent = list.filter(function (r) { return r._oth; }).length;
  $('sBad').textContent = list.filter(function (r) { return r._bad; }).length;
  $('sSoon').textContent = list.filter(function (r) { return (r._p && inWin(r._p, r._pt)) || (r._r && inWin(r._r, r._rt)); }).length;
  // ชิปวันที่เลือก
  $('dayChip').hidden = !view.day;
  if (view.day) $('dayChip').textContent = 'แสดงเฉพาะ ' + thaiDate(view.day, { day: 'numeric', month: 'long' }) + '  ✕';
  // รายการ
  var html = '', shown = 0, i = 0;
  while (i < ev.length && shown < LIMIT) {
    var d = ev[i].d, g = [];
    while (i < ev.length && ev[i].d === d) { g.push(ev[i]); i++; }
    shown += g.length;
    var cls = !d ? 'bad' : (d === today ? 'td' : '');
    html += '<section class="day"><div class="dh ' + cls + '"><span>' + (d ? (d === today ? 'วันนี้ · ' : '') + esc(thaiDate(d)) : 'ข้อมูลวันที่ไม่ครบ') +
      '</span><span class="muted">' + g.length + ' งาน</span></div>' + g.map(card).join('') + '</section>';
  }
  if (i < ev.length) html += '<button class="btn more" type="button" data-more="1">แสดงเพิ่ม (เหลือ ' + (ev.length - i) + ' งาน)</button>';
  if (!ev.length) html = '<div class="empty">ไม่มีงานในช่วงนี้<br><span class="muted">ลองเปลี่ยนช่วงเวลา หรือล้างคำค้นหา</span></div>';
  $('list').innerHTML = html;
}

/* ====== ปฏิทิน ====== */
function renderCal() {
  var today = todayISO();
  if (!view.cal) view.cal = { y: +today.slice(0, 4), m: +today.slice(5, 7) - 1 };
  var y = view.cal.y, m = view.cal.m;
  var first = new Date(Date.UTC(y, m, 1)).getUTCDay(), n = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
  $('calTitle').textContent = new Date(Date.UTC(y, m, 1)).toLocaleDateString('th-TH', { month: 'long', year: 'numeric', timeZone: 'UTC' });
  var by = {};
  base().forEach(function (r) {
    if (r._p) (by[r._p] = by[r._p] || []).push({ t: 'p', r: r });
    if (r._r) (by[r._r] = by[r._r] || []).push({ t: 'r', r: r });
  });
  var h = ['อา', 'จ', 'อ', 'พ', 'พฤ', 'ศ', 'ส'].map(function (d) { return '<div class="cw">' + d + '</div>'; }).join('') + '<div></div>'.repeat(first);
  for (var d = 1; d <= n; d++) {
    var iso = y + '-' + pad(m + 1) + '-' + pad(d), ev = by[iso] || [];
    h += '<button type="button" class="cd' + (iso === today ? ' td' : '') + (iso === view.day ? ' sel' : '') + '" data-d="' + iso + '" aria-label="วันที่ ' + d + ' มี ' + ev.length + ' งาน"><b>' + d + '</b>' +
      ev.slice(0, 2).map(function (x) { return '<small class="c' + x.t + '">' + (x.t === 'p' ? '▲' : '▼') + ' ' + esc(x.r.customer_name || x.r.company || 'รายการ') + '</small>'; }).join('') +
      (ev.length > 2 ? '<small class="mo">+' + (ev.length - 2) + ' งาน</small>' : '') + '</button>';
  }
  $('calgrid').innerHTML = h;
}
function refreshAll() { render(); if (!$('calendar').hidden) renderCal(); }

/* ====== โหลดข้อมูล (API ของคุณ หรือ Supabase) ====== */
var auth = null;
try { auth = JSON.parse(sessionStorage.getItem('rd_auth') || 'null'); } catch (e) {}
function setAuth(j) {
  if (!j) { auth = null; try { sessionStorage.removeItem('rd_auth'); } catch (e) {} return; }
  auth = { token: j.access_token, refresh: j.refresh_token, exp: Date.now() + (j.expires_in || 3600) * 1000 };
  try { sessionStorage.setItem('rd_auth', JSON.stringify(auth)); } catch (e) {}
}
function closeEdit() {
  view.editingId = '';
  $('editModal').hidden = true;
  $('editErr').textContent = '';
}
function openEdit(id) {
  var row = rows.find(function (r) { return String(r.id) === String(id); });
  if (!row) return;
  view.editingId = String(id);
  ['customer_name', 'customer_phone', 'booking_no', 'car', 'pickup_location', 'return_location', 'status'].forEach(function (name) {
    $('editForm').elements[name].value = row[name] || (name === 'status' ? 'รอตรวจสอบ' : '');
  });
  $('editForm').elements.pickup_date.value = row._p || '';
  $('editForm').elements.return_date.value = row._r || '';
  $('editForm').elements.pickup_time.value = row._pt || '';
  $('editForm').elements.return_time.value = row._rt || '';
  $('editForm').elements.edit_token.value = editToken();
  $('editErr').textContent = '';
  $('editModal').hidden = false;
}
function httpErr(status) { var e = new Error('HTTP ' + status); e.status = status; return e; }
function sbFetch(path, opt) {
  opt = opt || {};
  opt.headers = Object.assign({ apikey: CONFIG.SUPABASE_ANON_KEY, 'Content-Type': 'application/json' }, opt.headers || {});
  return fetch(CONFIG.SUPABASE_URL + path, opt);
}
async function getToken() {
  if (!auth) return null;
  if (auth.exp - Date.now() < 60000 && auth.refresh) {
    var r = await sbFetch('/auth/v1/token?grant_type=refresh_token', { method: 'POST', body: JSON.stringify({ refresh_token: auth.refresh }) });
    if (!r.ok) { setAuth(null); return null; }
    setAuth(await r.json());
  }
  return auth && auth.token;
}
async function fetchRows(signal) {
  var tk = null;
  if (CONFIG.REQUIRE_LOGIN) { tk = await getToken(); if (!tk) throw httpErr(401); }
  var r0 = await fetch(CONFIG.API_URL, { signal: signal, credentials: 'same-origin', headers: tk ? { Authorization: 'Bearer ' + tk } : {} });
  if (!r0.ok) throw httpErr(r0.status);
  var j0 = await r0.json();
  if (!Array.isArray(j0)) throw new Error('รูปแบบข้อมูลไม่ถูกต้อง (ต้องเป็น array)');
  return j0;
}
function errText(e) {
  if (e.name === 'AbortError') return 'โหลดนานเกินไป (เกิน 25 วินาที) กด “ลองใหม่” อีกครั้ง';
  if (e.status === 401) return 'ยังไม่ได้เข้าสู่ระบบ หรือเซสชันหมดอายุ';
  if (e.status === 403) return 'ไม่มีสิทธิ์อ่านข้อมูล — ตรวจสอบ RLS policy ของตาราง';
  if (e.status === 404) return 'ไม่พบตารางหรือปลายทางข้อมูล (404) — ตรวจสอบชื่อตาราง/URL';
  if (e.status >= 500) return 'เซิร์ฟเวอร์มีปัญหา (' + e.status + ') ลองใหม่อีกครั้งภายหลัง';
  if (e.status) return 'โหลดข้อมูลไม่สำเร็จ (' + e.status + ')';
  return 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ — ตรวจสอบอินเทอร์เน็ต';
}
async function reparseBooking(id, button) {
  var token = editToken() || window.prompt('กรอกรหัสผู้ดูแลเพื่ออ่านและบันทึกข้อมูลจากไฟล์อีกครั้ง');
  if (!token) return;
  button.disabled = true;
  var original = button.textContent;
  button.textContent = 'กำลังอ่านไฟล์…';
  try {
    var response = await fetch(CONFIG.EDIT_API_URL + '/' + encodeURIComponent(id) + '/reparse', {
      method: 'POST',
      headers: { 'X-Booking-Edit-Token': token }
    });
    var result = await response.json().catch(function () { return {}; });
    if (!response.ok) throw Object.assign(httpErr(response.status), { detail: result.error });
    try { sessionStorage.setItem('rd_edit_token', token); } catch (e) {}
    rows = rows.map(function (row) { return String(row.id) === String(id) ? prep(result.booking) : row; });
    fillSources(); refreshAll();
    window.alert(result.updatedFields && result.updatedFields.length ? 'อ่านไฟล์แล้ว และเติมข้อมูล: ' + result.updatedFields.join(', ') : 'อ่านไฟล์แล้ว ข้อมูลในรายการครบอยู่แล้ว');
  } catch (error) {
    window.alert(error.status === 403 ? 'รหัสผู้ดูแลไม่ถูกต้อง' : (error.detail || 'อ่านไฟล์ไม่สำเร็จ ลองใหม่อีกครั้ง'));
  } finally {
    button.disabled = false;
    button.textContent = original;
  }
}
function fillSources() {
  var sel = $('source'), cur = sel.value, set = {};
  rows.forEach(function (r) { if (r._src) set[r._src] = 1; });
  sel.innerHTML = '<option value="">ทุกแหล่งข้อมูล</option>' + Object.keys(set).sort().map(function (s) { return '<option>' + esc(s) + '</option>'; }).join('');
  if (set[cur]) sel.value = cur;
}
function showLogin(show) { $('login').hidden = !show; $('main').hidden = show; }

async function load(silent) {
  if (loading) return;
  loading = true;
  var ctrl = new AbortController(), to = setTimeout(function () { ctrl.abort(); }, 25000);
  $('rf').disabled = true;
  if (!silent && !rows.length) $('list').innerHTML = '<div class="sk"></div><div class="sk"></div><div class="sk"></div>';
  try {
    rows = (await fetchRows(ctrl.signal)).map(prep);
    lastLoad = Date.now();
    $('err').hidden = true; showLogin(false);
    $('upd').textContent = 'อัปเดตล่าสุด ' + new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Bangkok' });
    fillSources(); refreshAll();
  } catch (e) {
    if (SB && CONFIG.REQUIRE_LOGIN && e.status === 401) { setAuth(null); showLogin(true); $('err').hidden = true; $('upd').textContent = 'กรุณาเข้าสู่ระบบ'; }
    else {
      $('errMsg').textContent = errText(e); $('err').hidden = false; $('upd').textContent = 'โหลดไม่สำเร็จ';
      if (!rows.length) $('list').innerHTML = '';
    }
  } finally { clearTimeout(to); loading = false; $('rf').disabled = false; }
}

/* ====== เหตุการณ์ ====== */
$('login').addEventListener('submit', async function (ev) {
  ev.preventDefault();
  $('loginErr').textContent = '';
  try {
    var r = await sbFetch('/auth/v1/token?grant_type=password', { method: 'POST', body: JSON.stringify({ email: $('em').value.trim(), password: $('pw').value }) });
    if (!r.ok) { $('loginErr').textContent = 'อีเมลหรือรหัสผ่านไม่ถูกต้อง'; return; }
    setAuth(await r.json()); $('pw').value = ''; load();
  } catch (e) { $('loginErr').textContent = 'เชื่อมต่อไม่ได้ ลองใหม่อีกครั้ง'; }
});
$('list').addEventListener('click', function (e) {
  var b = e.target.closest('.sum');
  if (b) { var o = b.parentNode.classList.toggle('open'); b.setAttribute('aria-expanded', o); return; }
  var edit = e.target.closest('[data-edit]');
  if (edit) { openEdit(edit.dataset.edit); return; }
  var reparse = e.target.closest('[data-reparse]');
  if (reparse) { reparseBooking(reparse.dataset.reparse, reparse); return; }
  if (e.target.closest('[data-more]')) { LIMIT += 150; render(); }
});
$('editClose').onclick = closeEdit;
$('editCancel').onclick = closeEdit;
$('editModal').addEventListener('click', function (e) { if (e.target === $('editModal')) closeEdit(); });
$('editForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  var token = String($('editForm').elements.edit_token.value || '').trim();
  if (!view.editingId || !token) { $('editErr').textContent = 'กรอกรหัสผู้ดูแลก่อนบันทึก'; return; }
  var form = new FormData($('editForm')), payload = {};
  form.forEach(function (value, key) { if (key !== 'edit_token') payload[key] = String(value).trim(); });
  $('editSave').disabled = true;
  $('editErr').textContent = '';
  try {
    var response = await fetch(CONFIG.EDIT_API_URL + '/' + encodeURIComponent(view.editingId), {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json', 'X-Booking-Edit-Token': token },
      body: JSON.stringify(payload)
    });
    if (!response.ok) throw httpErr(response.status);
    var updated = await response.json();
    try { sessionStorage.setItem('rd_edit_token', token); } catch (e) {}
    rows = rows.map(function (row) { return String(row.id) === String(updated.id) ? prep(updated) : row; });
    closeEdit(); fillSources(); refreshAll();
  } catch (error) {
    $('editErr').textContent = error.status === 403 ? 'รหัสผู้ดูแลไม่ถูกต้อง' : 'บันทึกไม่สำเร็จ ลองใหม่อีกครั้ง';
  } finally { $('editSave').disabled = false; }
});
$('calgrid').addEventListener('click', function (e) {
  var c = e.target.closest('[data-d]'); if (!c) return;
  view.day = view.day === c.dataset.d ? '' : c.dataset.d;
  LIMIT = 150; refreshAll(); $('list').scrollIntoView({ behavior: 'smooth', block: 'start' });
});
$('dayChip').onclick = function () { view.day = ''; refreshAll(); };
$('calbtn').onclick = function () {
  var h = !$('calendar').hidden; $('calendar').hidden = h;
  $('calbtn').setAttribute('aria-expanded', String(!h)); $('calbtn').classList.toggle('on', !h);
  if (!h) renderCal();
};
function moveCal(n) { view.cal.m += n; if (view.cal.m < 0) { view.cal.m = 11; view.cal.y--; } if (view.cal.m > 11) { view.cal.m = 0; view.cal.y++; } renderCal(); }
$('cPrev').onclick = function () { moveCal(-1); };
$('cNext').onclick = function () { moveCal(1); };
$('cToday').onclick = function () { view.cal = null; renderCal(); };
var timer;
$('q').addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(function () { LIMIT = 150; refreshAll(); }, 150); });
['period', 'mode', 'source', 'kind'].forEach(function (id) { $(id).addEventListener('change', function () { if (id === 'period') view.day = ''; LIMIT = 150; refreshAll(); }); });
$('rf').onclick = function () { load(); };
$('retry').onclick = function () { load(); };
document.addEventListener('visibilitychange', function () { if (!document.hidden && Date.now() - lastLoad > 300000) load(true); });
setInterval(function () { if (!document.hidden && Date.now() - lastLoad > 300000) load(true); }, 60000);

$('today').textContent = 'วันนี้ ' + thaiDate(todayISO());
load();
</script>
</body>
