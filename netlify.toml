[build]
  publish = "web"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/bookings"
  to = "/.netlify/functions/bookings"
  status = 200

[[redirects]]
  from = "/api/bookings/*"
  to = "/.netlify/functions/booking/:splat"
  status = 200

[[redirects]]
  from = "/api/cars"
  to = "/.netlify/functions/cars"
  status = 200

[[redirects]]
  from = "/api/cars/*"
  to = "/.netlify/functions/cars/:splat"
  status = 200

[[redirects]]
  from = "/api/booking-options"
  to = "/.netlify/functions/booking-options"
  status = 200
